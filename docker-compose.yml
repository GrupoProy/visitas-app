services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visitas_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-user_visitas}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-basedatos_rrhh}
      DB_SCHEMA: ${DB_SCHEMA:-visitasdb}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: ${JWT_EXPIRES:-8h}
      TZ: America/La_Paz
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    networks:
      - visitas_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: visitas_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - visitas_net

networks:
  visitas_net:
    name: visitas_net